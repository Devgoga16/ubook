<title>uBook Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky sidebar (business switcher + grouped nav) beside a main canvas; each nav item swaps a full screen in place */
:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#F4F5F8;--ink:#1E1F3B;--ink-2:#4A4C6B;--muted:#9799AE;
  --line:#ECEDF2;--line-strong:#D9DBE6;--brand:#575B9F;--brand-soft:#EEEFF8;--teal:#62C9D6;--teal-soft:#E6F7F9;--teal-line:#92D6E0;
  --grad:linear-gradient(160deg,#6CD3DD 0%,#5F8FC4 48%,#575B9F 100%);
  --ok:#2F9CAB;--ok-bg:#E3F5F7;--warn:#7A6BB8;--warn-bg:#EFEDF8;--bad:#C2566A;--bad-bg:#F9E8EC;--info:#575B9F;--info-bg:#E9EAF6;--off:#8C8EA3;--off-bg:#F0F1F5;--done:#6B6E90;--done-bg:#EDEEF3;
  --map-bg:#EEF1F4;--map-road:#FFFFFF;--map-road2:#F6D98A;--map-water:#A9D6EE;--map-park:#CDE8C9;
  --wa-bg:#E9E2D8;--wa-bub:#FFFFFF;--wa-me:#D7F5C9;
  --shadow:0 1px 2px rgba(31,34,69,.04),0 8px 24px rgba(31,34,69,.06);
  color-scheme:light;
  --f:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13px;line-height:1.45}
h1,h2,h3,h4{text-wrap:balance}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{flex:none;display:block}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.logo{font-weight:700;font-size:23px;color:var(--brand);letter-spacing:-.02em;padding:0 8px 14px;border-bottom:1px solid var(--line);text-align:center}
.logo span{color:var(--teal)}
.biz{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 6px}
.biz-logo{width:62px;height:62px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--ink)}
.biz-n{font-weight:600;font-size:13px}
.biz-s{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:none;cursor:pointer}
.navs{display:flex;flex-direction:column;gap:10px}
.nav-g{display:flex;flex-direction:column;gap:1px}
.nav-t{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:4px 8px;font-weight:700}
.nav-a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;color:var(--ink-2);font-size:12px;font-weight:500;cursor:pointer;border:0;background:none;text-align:left;white-space:nowrap}
.nav-a .nb{width:27px;height:27px;border-radius:8px;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--brand)}
.nav-a:hover{background:var(--surface-2)}
.nav-a.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav-a.on .nb{background:var(--grad);border-color:transparent;color:#fff}
.addc{border:1.5px dashed var(--line-strong);border-radius:16px;padding:10px;display:flex}
.addc>div{flex:1;background:var(--grad);border-radius:12px;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:118px;font-weight:600;font-size:14px;line-height:1.25;cursor:pointer}
.plus{width:26px;height:26px;border-radius:50%;background:#fff;color:#575B9F;display:grid;place-items:center;align-self:center}
/* main */
.main{min-width:0;padding-block:20px 48px;padding-inline:28px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.crumb{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.top h1{font-size:13px;margin:3px 0 0;font-weight:700;color:var(--brand)}
.top-r{display:flex;gap:12px;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;color:var(--muted);background:var(--surface);min-width:240px;cursor:pointer;font-size:12px}
.search kbd{margin-left:auto;font-family:inherit;font-size:10px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px}
.icbtn{background:none;border:0;color:var(--ink-2);cursor:pointer;position:relative;padding:4px;border-radius:8px;display:grid;place-items:center}
.icbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:-4px;right:-8px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px}
.ov{font-weight:600;font-size:14px;margin:0}
#screen{display:flex;flex-direction:column;gap:20px;min-width:0}
/* building blocks */
.g-auto{grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,300px)}.g-web{grid-template-columns:minmax(0,1fr) minmax(0,320px)}.g-cf{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,280px)}
.card{background:var(--surface);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.muted{color:var(--muted)}.sm{font-size:11.5px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{margin-left:auto}
.grid{display:grid;gap:18px;min-width:0}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,1fr) 340px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:center}
.hero h2{font-size:30px;line-height:1.12;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.kpi{border:1.5px solid var(--teal-line);border-radius:14px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:3px;color:var(--brand);text-align:left;cursor:pointer;min-height:132px}
.kpi .ki{margin-bottom:auto;padding-bottom:14px}
.kpi b{font-size:13px;font-weight:600}
.kpi .kv{font-size:21px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .kd{font-size:11px;color:var(--muted)}
.kpi.on{background:var(--grad);border-color:transparent;color:#fff}
.kpi.on .kv,.kpi.on .kd{color:#fff}
.kpi.flat{flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px;border:0;box-shadow:var(--shadow);cursor:default}
.kpi.flat .ki{margin:0;padding:0;color:var(--ink-2)}
.kpi.flat .kv{font-size:15px}
.kpi.flat b{color:var(--muted);font-weight:600;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-conf{color:var(--ok);background:var(--ok-bg)}.st-pend{color:var(--warn);background:var(--warn-bg)}.st-curso{color:var(--info);background:var(--info-bg)}
.st-comp{color:var(--done);background:var(--done-bg)}.st-can{color:var(--bad);background:var(--bad-bg)}.st-nos{color:var(--off);background:var(--off-bg)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.tag.t{background:var(--teal-soft);color:var(--teal)}.tag.r{background:var(--bad-bg);color:var(--bad)}.tag.w{background:var(--warn-bg);color:var(--warn)}.tag.g{background:var(--ok-bg);color:var(--ok)}.tag.o{background:var(--off-bg);color:var(--off)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.dng{color:var(--bad)}
.tw{overflow-x:auto;margin-inline:-6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;color:var(--muted);font-size:11px;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td,tr.sel td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:11.5px;flex:none;letter-spacing:.02em}
.av.r{border-radius:50%}.av.s{width:26px;height:26px;font-size:9.5px;border-radius:7px}.av.l{width:52px;height:52px;font-size:16px;border-radius:14px}
.avs{display:flex}.avs .av{margin-left:-7px;border:2px solid var(--surface)}.avs .av:first-child{margin-left:0}
.tg{width:34px;height:20px;border-radius:20px;background:var(--line-strong);position:relative;flex:none;border:0;cursor:pointer;padding:0}
.tg::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.tg.on{background:var(--teal)}.tg.on::after{left:17px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:11.5px;color:var(--muted);cursor:pointer;font-weight:600}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .on{color:var(--brand);border-color:var(--teal)}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-size:11px;color:var(--muted);font-weight:600}
.inp{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:64px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;font-size:12px;align-items:center}
.dl dt{display:flex;align-items:center;gap:8px;font-weight:600}
.dl dd{margin:0;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px}
.dash-add{border:1.5px dashed var(--line-strong);border-radius:16px;padding:10px;display:flex;min-height:180px}
.dash-add>div{flex:1;background:var(--grad);border-radius:12px;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;font-weight:600;font-size:15px;text-align:center;cursor:pointer}
.photo{background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:600;font-size:28px;border-radius:10px;position:relative;overflow:hidden}
.photo::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%)}
.lst>*{border-top:1px solid var(--line);padding-block:11px}
.lst>*:first-child{border-top:0;padding-top:0}
.alert{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center}
.alert .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:10px}
.cal-n{display:flex;gap:2px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.cal-g .dn{color:var(--muted);font-size:10.5px;font-weight:600;padding-bottom:4px}
.cal-g .d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;cursor:pointer;position:relative;font-weight:500}
.cal-g .d:hover{background:var(--surface-2)}
.d.o{color:var(--line-strong)}
.d.sel{background:var(--grad);color:#fff}
.d.today{box-shadow:inset 0 0 0 1.5px var(--teal)}
.d.dot::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--teal)}
.d.sel.dot::after{background:#fff}
.d.full{color:var(--muted);text-decoration:line-through}
.cal.big .cal-g{gap:6px;font-size:13px}
/* agenda */
.ag{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.agw{overflow-x:auto}
.agg{min-width:680px;display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr))}
.agh{padding:0 8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);min-width:0}
.agh .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc{position:relative;height:680px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 68px),repeating-linear-gradient(to bottom,transparent 0 34px,var(--surface-2) 34px 35px,transparent 35px 68px)}
.agt{position:relative;height:680px}
.agt span{position:absolute;right:8px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.ap{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 8px;font-size:10.5px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:3px solid var(--c);color:var(--ink-2);text-align:left;border-top:0;border-right:0;border-bottom:0}
.ap:hover{box-shadow:var(--shadow);z-index:3}
.ap b{display:block;font-weight:600;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .apm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ap.can{opacity:.55}.ap.can b{text-decoration:line-through}.ap.nos{opacity:.6;border-left-style:dashed}
.ap .ast{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%}
.brk{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px);font-size:10px;color:var(--muted);display:grid;place-items:center;font-weight:600}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.lg{display:flex;flex-direction:column;gap:7px;font-size:11.5px}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);display:inline-grid;place-items:center;flex:none;color:#fff;cursor:pointer;background:var(--surface)}
.ck.on{background:var(--brand);border-color:var(--brand)}
/* overlay layer */
#layer{position:fixed;inset:0;z-index:50;background:rgba(17,19,41,.38)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);box-shadow:-10px 0 40px rgba(0,0,0,.18);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.pal{position:absolute;top:12vh;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 32px));background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in input{border:0;outline:0;font:inherit;font-size:14px;flex:1;background:none;color:var(--ink);min-width:0}
.pal-g{padding:8px}
.pal-t{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:12.5px;cursor:pointer}
.pal-i.on,.pal-i:hover{background:var(--surface-2)}
.pal-i kbd{margin-left:auto;font-family:inherit;font-size:10px;color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px}
.notif{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:24px;width:min(380px,calc(100% - 32px));background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:16px;max-height:76vh;overflow-y:auto}
.ni{display:grid;grid-template-columns:34px minmax(0,1fr) 8px;gap:10px;align-items:start;padding:10px 6px;border-radius:10px}
.ni.u{background:var(--surface-2)}
.ni .ud{width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:6px}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl-i::before{content:'';position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-d{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:#fff}
.tl-i.done .tl-d{background:var(--teal);border-color:var(--teal)}
.tl-i.cur .tl-d{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.tl-i.done::before{background:var(--teal)}
.tl-i b{font-size:12px;display:block}
/* wizard */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-size:11px;color:var(--muted)}
.step.done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done{color:var(--ink-2)}
.step.act{color:var(--ink);box-shadow:0 0 0 1.5px var(--teal)}
.step.act .n{background:var(--grad);color:#fff;border:0}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--line-strong);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--teal)}
.slot:disabled{color:var(--muted);background:var(--surface-2);text-decoration:line-through;cursor:not-allowed;border-style:dashed}
.slot.on{background:var(--grad);color:#fff;border-color:transparent}
.slot .hot{position:absolute;top:-8px;right:-6px;background:var(--warn);color:#fff;font-size:8.5px;padding:1px 5px;border-radius:6px;text-decoration:none}
.sumr{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding-block:8px;border-top:1px solid var(--line)}
.sumr span:first-child{color:var(--muted)}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
/* week editor */
.wk{display:grid;grid-template-columns:40px minmax(0,1fr) 34px;gap:8px 12px;align-items:center;font-size:11.5px}
.wk-t{position:relative;height:28px;background:var(--surface-2);border-radius:7px;box-shadow:inset 0 0 0 1px var(--line)}
.wk-b{position:absolute;top:3px;bottom:3px;background:color-mix(in srgb,var(--teal) 28%,var(--surface));border:1px solid var(--teal);border-radius:5px;font-size:10px;display:flex;align-items:center;padding:0 6px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;cursor:ew-resize}
.wk-b.br{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--line) 5px 6px);border-color:var(--line-strong);color:var(--muted)}
.wk-b.off{background:var(--off-bg);border-color:var(--line-strong);color:var(--muted);left:0;right:0}
.wk-ax{position:relative;height:14px;font-size:9.5px;color:var(--muted)}
.wk-ax span{position:absolute;transform:translateX(-50%)}
/* coupons */
.tk{display:grid;grid-template-columns:104px minmax(0,1fr);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative}
.tk-l{background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:700;line-height:1;gap:4px;padding:10px}
.tk-l small{font-size:10px;font-weight:600;opacity:.9}
.tk::before,.tk::after{content:'';position:absolute;left:94px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tk::before{top:-10px}.tk::after{bottom:-10px}
.tk-r{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:2px dashed var(--line-strong)}
.code{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-weight:700;letter-spacing:.06em;font-size:13px;color:var(--ink)}
/* flow */
.flow{display:flex;flex-direction:column;align-items:center}
.node{width:min(100%,360px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;box-shadow:var(--shadow)}
.node.on{box-shadow:0 0 0 1.5px var(--teal),var(--shadow)}
.node .nt{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.node .nic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.conn{width:2px;height:16px;background:var(--line-strong)}
.cadd{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted);background:var(--surface);cursor:pointer}
.fl-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-radius:10px;cursor:pointer;align-items:center}
.fl-i.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.var{background:var(--teal-soft);color:var(--teal);border-radius:4px;padding:0 4px;font-weight:600}
/* phone */
.phone{width:280px;max-width:100%;border-radius:36px;border:9px solid #1F2245;background:var(--surface);overflow:hidden;margin:0 auto;box-shadow:0 18px 40px rgba(31,34,69,.25)}
.ph-bar{display:flex;justify-content:space-between;font-size:10px;font-weight:600;padding:8px 18px 4px;color:var(--ink)}
.wa{background:var(--wa-bg);min-height:430px;padding:12px;display:flex;flex-direction:column;gap:8px}
.wa-h{display:flex;align-items:center;gap:8px;background:var(--surface);margin:-12px -12px 4px;padding:10px 12px;font-size:12px;font-weight:600}
.bub{background:var(--wa-bub);border-radius:10px;padding:8px 10px;font-size:11.5px;max-width:88%;box-shadow:0 1px 1px rgba(0,0,0,.08);color:var(--ink)}
.bub.me{background:var(--wa-me);align-self:flex-end}
.bub small{display:block;text-align:right;color:var(--muted);font-size:9px;margin-top:3px}
.bub .qr{display:block;text-align:center;color:var(--info);font-weight:600;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.pb{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:440px;background:var(--surface-2)}
.pb-s{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:10px;padding:10px;font-size:11.5px;box-shadow:var(--shadow)}
/* map */
.map{border-radius:14px;overflow:hidden;position:relative;background:var(--map-bg);box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.mpop{position:absolute;left:24%;top:22%;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);display:flex;gap:10px;padding:8px;align-items:center;font-size:11px;max-width:60%}
.mpop .photo{width:70px;height:54px;font-size:12px;flex:none}
.br-c{display:grid;grid-template-columns:150px minmax(0,1fr);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1.5px solid transparent}
.br-c.on{border-color:var(--teal-line)}
.br-c .photo{border-radius:0;font-size:13px;min-height:200px}
.br-b{padding:14px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;min-width:0}
/* heatmap */
.hm{display:grid;grid-template-columns:34px repeat(12,minmax(0,1fr));gap:3px;font-size:10px;color:var(--muted);min-width:520px}
.hm i{height:24px;border-radius:4px;display:block}
.hm span{display:flex;align-items:center;justify-content:center}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12px}
.hbar .bar{height:10px}
/* field builder */
.fb-type{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px dashed var(--line-strong);border-radius:9px;font-size:12px;cursor:grab;background:var(--surface);color:var(--ink-2);font-weight:500}
.fb-f{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface)}
.fb-f.on{box-shadow:0 0 0 1.5px var(--teal)}
.grip{color:var(--line-strong);cursor:grab}
.vt{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:var(--ink);position:relative}
.vt:hover{border-color:var(--teal-line)}
.vt.on{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.vt .vi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.vt.on .vi{background:var(--grad);color:#fff}
.term{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:10px;align-items:center}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:120px;aspect-ratio:1;max-width:100%;background:#fff;padding:6px;border-radius:8px}
.qr i{background:#1F2245}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--teal)}
.banner{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--grad);color:#fff;border-radius:14px;padding:16px 18px}
.banner .bi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.banner .btn{background:#fff;color:#575B9F;border:0}
.rule{display:flex;flex-direction:column;gap:10px}
.rule-h{display:flex;gap:12px;align-items:flex-start}
.rule-h .ri{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.rule p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.val{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600}
.pill-m{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:1180px){.gside,.g-auto,.g-cf{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.g2,.g3,.g2e,.hero,.ag,.g-web{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .logo{text-align:left;padding-bottom:10px}
  .biz{flex-direction:row}.biz-logo{width:40px;height:40px;font-size:9px}
  .navs{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-g{flex-direction:row}.nav-t,.side .addc{display:none}
  .main{padding-inline:16px}
  .search{min-width:0;flex:1}.top-r{width:100%}
  .br-c{grid-template-columns:minmax(0,1fr)}.br-c .photo{min-height:120px}
  .hbar{grid-template-columns:100px minmax(0,1fr) 60px}
}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}.alert{grid-template-columns:32px minmax(0,1fr)}.alert .btn{grid-column:2;justify-self:start}.banner{grid-template-columns:minmax(0,1fr)}.banner .bi{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const ck=on=>`<span class="ck${on?' on':''}" role="checkbox" aria-checked="${!!on}" tabindex="0">${on?ic('chk',11):''}</span>`;
const kpi=(i,l,v,d,on)=>`<button class="kpi${on?' on':''}" type="button"><span class="ki">${ic(i,26)}</span><b>${l}</b><span class="kv">${v}</span><span class="kd">${d}</span></button>`;
const kf=(i,l,v)=>`<div class="kpi flat">${ic(i,26)}<div><b>${l}</b><div class="kv">${v}</div></div></div>`;
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function cal(y,m,o={}){
  const names=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
  const off=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
  let c='';
  for(let i=0;i<off;i++)c+=`<span class="d o">${prev-off+1+i}</span>`;
  for(let d=1;d<=dim;d++){let k='d';if(d===o.sel)k+=' sel';if(d===o.today&&d!==o.sel)k+=' today';if(o.dots&&o.dots(d))k+=' dot';if(o.full&&o.full(d))k+=' full';c+=`<span class="${k}">${d}</span>`}
  const rest=(7-(off+dim)%7)%7;for(let i=1;i<=rest;i++)c+=`<span class="d o">${i}</span>`;
  return `<div class="cal ${o.big?'big':''}"><div class="cal-h"><span>${MES[m]} ${y}</span><span class="cal-n"><button class="icbtn" type="button" aria-label="Mes anterior">${ic('cl',16)}</button><button class="icbtn" type="button" aria-label="Mes siguiente">${ic('cr',16)}</button></span></div><div class="cal-g">${names.map(n=>`<span class="dn">${n}</span>`).join('')}${c}</div></div>`;
}

function qr(){let s=7,c='';const rnd=()=>(s=(s*9301+49297)%233280)/233280;const fin=(x,y)=>{for(const[fx,fy]of[[0,0],[14,0],[0,14]]){const dx=x-fx,dy=y-fy;if(dx>=0&&dx<7&&dy>=0&&dy<7)return(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4))?1:0}return-1};for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=fin(x,y);const on=f===-1?rnd()>.5:f;c+=`<i style="${on?'':'background:transparent'}"></i>`}return `<div class="qr" role="img" aria-label="Código QR de la página de reservas">${c}</div>`}

/* ---------- drawer, paleta, notificaciones ---------- */
const layer=document.getElementById('layer');
function closeLayer(){layer.hidden=true;layer.innerHTML=''}
layer.addEventListener('click',e=>{if(e.target===layer||e.target.closest('[data-close]'))closeLayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}});
function openDrawer(i){
  const a=AP[i],s=STAFF[a[0]],pr=PRICE[a[4]]||50,dep=Math.max(10,Math.round(pr*.3/5)*5);

    <div class="row"><span class="muted sm">Cita #UB-${2470+i}</span>${chip(a[5])}<button class="icbtn sp" type="button" data-close aria-label="Cerrar">${ic('x')}</button></div>
    <div class="row" style="flex-wrap:nowrap">${av(a[3],cc(a[3]),'l r')}<div><div class="b" style="font-size:16px">${a[3]}</div><div class="muted sm">+51 987 654 321 · 14 visitas</div><div class="row" style="gap:5px;margin-top:4px"><span class="tag">VIP</span><span class="tag t">Prefiere WhatsApp</span></div></div></div>
    <div class="row"><button class="btn sm" type="button">${ic('msg',13)} WhatsApp</button><button class="btn sm" type="button">${ic('phone',13)} Llamar</button><button class="btn sm" type="button" data-close data-go="ficha">${ic('idc',13)} Ver ficha</button></div>
    <dl class="dl" style="border-top:1px solid var(--line);padding-top:14px">
      <dt>${ic('sc',15)} Servicio</dt><dd>${a[4]}</dd>
      <dt>${ic('user',15)} Profesional</dt><dd>${s[0]}</dd>
      <dt>${ic('cal',15)} Fecha</dt><dd>Martes 6 oct · ${hm(a[1])} – ${hm(a[1]+a[2])}</dd>
      <dt>${ic('box',15)} Recurso</dt><dd>Sillón ${a[0]+1}</dd>

    </dl>
    <div><div class="lbl" style="margin-bottom:10px">Estado</div><div class="tl">${steps.map((st,k)=>{const cls=a[5]==='can'||a[5]==='nos'?(k===0?'done':''):(k<lvl?'done':k===lvl?'cur':'');return `<div class="tl-i ${cls}"><span class="tl-d">${cls==='done'?ic('chk',11):''}</span><div><b>${st[0]}</b><div class="muted sm">${cls?st[1]:'—'}</div></div></div>`}).join('')}
      ${a[5]==='can'?`<div class="tl-i"><span class="tl-d" style="border-color:var(--bad);background:var(--bad-bg)"></span><div><b style="color:var(--bad)">Cancelada por el cliente</b><div class="muted sm">Depósito devuelto (más de 12 h)</div></div></div>`:''}
      ${a[5]==='nos'?`<div class="tl-i"><span class="tl-d" style="border-color:var(--off);background:var(--off-bg)"></span><div><b>No asistió</b><div class="muted sm">Depósito retenido según la política</div></div></div>`:''}</div></div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px">
      <div class="sumr" style="border:0;padding-top:0"><span>Total</span><b>S/ ${pr.toFixed(2)}</b></div>
      <div class="sumr"><span>Depósito (Yape)</span><b style="color:var(--ok)">− S/ ${dep.toFixed(2)}</b></div>
      <div class="sumr"><span>Saldo por cobrar</span><b>S/ ${(pr-dep).toFixed(2)}</b></div>

    ${[['calp','var(--teal)','var(--teal-soft)','Nueva reserva web','Lucía Mendoza · Tinte + corte · hoy 14:30','hace 4 min',1],['x','var(--bad)','var(--bad-bg)','Cita cancelada','Hugo Silva canceló jue 8 · 15:00. 3 personas en espera coinciden.','hace 20 min',1],['cash','var(--ok)','var(--ok-bg)','Depósito recibido','Mateo Huamán pagó S/ 20 por Yape','hace 1 h',1],['msg','var(--info)','var(--info-bg)','Nueva reseña 5 ★','«Luis siempre clava el corte»','hace 2 h',0],['clock','var(--warn)','var(--warn-bg)','5 citas sin confirmar','Para mañana miércoles','hace 3 h',0],['user','var(--brand)','var(--brand-soft)','Diego pidió permiso','Hoy desde las 17:30 · trámite','ayer',0]].map(n=>`<div class="ni${n[6]?' u':''}"><span class="av" style="color:${n[1]};background:${n[2]}">${ic(n[0],16)}</span><div style="min-width:0"><div class="b sm">${n[3]}</div><div class="sm" style="color:var(--ink-2)">${n[4]}</div><div class="muted" style="font-size:10.5px;margin-top:2px">${n[5]}</div></div>${n[6]?'<span class="ud"></span>':'<span></span>'}</div>`).join('')}

document.getElementById('openPal').addEventListener('click',openPal);

/* ---------- navegación ---------- */
const nav=document.getElementById('nav');
function buildNav(){
  const groups={};Object.entries(S).forEach(([k,v])=>(groups[v.g]=groups[v.g]||[]).push([k,v]));
  nav.innerHTML=Object.entries(groups).map(([g,items])=>`<div class="nav-g"><div class="nav-t">${g}</div>${items.map(([k,v])=>`<button class="nav-a" type="button" data-go="${k}"><span class="nb">${ic(v.i,14)}</span>${v.l}</button>`).join('')}</div>`).join('');
}
function go(k){
  if(!S[k])k='dash';
  const s=S[k];
  document.getElementById('screen').innerHTML=s.r();
  document.getElementById('crumb').innerHTML=`${ic('home',12)} / ${s.c}`;
  document.getElementById('ttl').textContent=s.l;
  nav.querySelectorAll('.nav-a').forEach(a=>a.classList.toggle('on',a.dataset.go===k));
  try{history.replaceState(null,'','#'+k)}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tg');if(t){t.classList.toggle('on');t.setAttribute('aria-pressed',t.classList.contains('on'));return}
  const c=e.target.closest('.ck');if(c&&!e.target.closest('tr[data-go]')){c.classList.toggle('on');c.innerHTML=c.classList.contains('on')?ic('chk',11):'';return}
  const ap=e.target.closest('[data-ap]');if(ap){openDrawer(+ap.dataset.ap);return}
  const g=e.target.closest('[data-go]');if(g){if(g.closest('#layer'))closeLayer();go(g.dataset.go);return}
  const sg=e.target.closest('.seg button');if(sg){sg.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));sg.classList.add('on');return}
  const fc=e.target.closest('.fchip');if(fc){fc.parentNode.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));fc.classList.add('on');return}
  const vt=e.target.closest('.vt');if(vt){vt.parentNode.querySelectorAll('.vt').forEach(b=>b.classList.remove('on'));vt.classList.add('on');return}
  const sl=e.target.closest('.slot:not(:disabled)');if(sl){document.querySelectorAll('.slot').forEach(b=>b.classList.remove('on'));sl.classList.add('on');return}
  const ct=e.target.closest('#cfgTabs button');if(ct){ct.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===ct));document.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!==ct.dataset.t);return}
  const tb=e.target.closest('.tabs button');if(tb){tb.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===tb));return}
  if(e.target.closest('#copyUrl')){const i=document.getElementById('url');const b=e.target.closest('#copyUrl');const done=()=>{b.innerHTML=ic('chk',14)+' Copiado'};try{navigator.clipboard.writeText('https://'+i.value).then(done,()=>{i.select()})}catch(err){i.select()}}
});
buildNav();
go((location.hash||'').slice(1)||'dash');
</script>
